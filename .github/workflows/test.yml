name: Monetary core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run demo
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test web app in desktop and mobile browser
        run: node test/browser-smoke.mjs
      - name: Save web previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agarmon-web-previews
          path: test-output/
          if-no-files-found: ignore
